name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Packages
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Production Binaries
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o neodm.exe main.go
          go build -ldflags="-s -w -H=windowsgui" -o ifd.exe main.go
          go build -ldflags="-s -w" -o NovaDM-PRO-Setup.exe installer/main.go

      - name: Package Distribution Archives
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item NovaDM-PRO-Setup.exe dist/

          # Package Portable Windows x64 ZIP
          $tempDir = "temp_portable"
          New-Item -ItemType Directory -Force -Path $tempDir
          Copy-Item neodm.exe $tempDir/
          Copy-Item ifd.exe $tempDir/
          Copy-Item README.md $tempDir/
          Copy-Item LICENSE $tempDir/
          Copy-Item -Recurse extension $tempDir/extension
          Compress-Archive -Path "$tempDir/*" -DestinationPath dist/NovaDM-PRO-windows-x64.zip -Force
          Remove-Item -Recurse -Force $tempDir

          # Package Browser Companion Extension ZIP
          Compress-Archive -Path "extension/*" -DestinationPath dist/NovaDM-Browser-Extension.zip -Force

          # Generate SHA256 Checksums
          Get-FileHash -Algorithm SHA256 (Get-ChildItem dist/*) | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding utf8 dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          title: "Nova Download Manager PRO ${{ github.ref_name }}"
          draft: false
          prerelease: false
