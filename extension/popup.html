<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeoDM Browser Integration</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrap">
    <div class="popup-header">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <div>
          <h2>NeoDM PRO</h2>
          <span class="subtitle">Neo Download Manager</span>
        </div>
      </div>
      <div class="status-badge" id="engine-status">
        <span class="status-dot"></span> <span id="status-text">Checking...</span>
      </div>
    </div>

    <div class="toggle-card">
      <div class="toggle-info">
        <strong>Auto-Capture Downloads</strong>
        <span>Intercept browser files automatically</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-auto" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="quick-add-box">
      <label>Quick Download Link:</label>
      <div class="input-row">
        <input type="text" id="quick-url-input" placeholder="https://...">
        <button id="btn-quick-download" class="btn-primary">Download</button>
      </div>
    </div>

    <div class="actions-grid">
      <button id="btn-grab-page" class="btn-action">
        <span>🕸️</span> Grab Page Links
      </button>
      <button id="btn-open-app" class="btn-action">
        <span>🖥️</span> Open NeoDM
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
